<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nandani 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Pacifico&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at top left, #ffd6e8, transparent 40%),
    radial-gradient(circle at bottom right, #e6d9ff, transparent 40%),
    linear-gradient(135deg,#ffb6d5,#e9dcff);
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

/* Floating hearts */
.heart{
  position:absolute;
  bottom:-50px;
  color:rgba(255,64,129,0.3);
  font-size:20px;
  animation:float 10s linear infinite;
}

@keyframes float{
  from{transform:translateY(0);opacity:1;}
  to{transform:translateY(-110vh);opacity:0;}
}

.card{
  width:92%;
  max-width:380px;
  background:rgba(255,255,255,0.92);
  backdrop-filter:blur(6px);
  border-radius:26px;
  padding:24px;
  text-align:center;
  box-shadow:0 20px 40px rgba(0,0,0,0.25);
  z-index:2;
}

h1{
  font-family:'Pacifico',cursive;
  color:#ff3f81;
  font-size:32px;
  margin-bottom:14px;
}

/* GIF */
#gif{
  width:100%;
  max-width:320px;
  height:220px;
  object-fit:contain;
  border-radius:18px;
  margin:12px auto 18px;
  display:block;
  pointer-events:none;
}

#text{
  font-size:18px;
  margin-bottom:20px;
}

/* Buttons */
.buttons{
  display:flex;
  justify-content:center;
  gap:16px;
}

button{
  padding:13px 28px;
  border:none;
  border-radius:30px;
  font-size:16px;
  cursor:pointer;
}

#yes{
  background:#ff3f81;
  color:#fff;
  animation:pulse 1.4s infinite;
}

@keyframes pulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.12);}
  100%{transform:scale(1);}
}

#no{
  background:#e0e0e0;
}

/* Music hint */
.music-hint{
  font-size:12px;
  color:#888;
  margin-top:10px;
}
</style>
</head>

<body>

<!-- floating hearts -->
<script>
for(let i=0;i<18;i++){
  const h=document.createElement("div");
  h.className="heart";
  h.innerText="❤️";
  h.style.left=Math.random()*100+"vw";
  h.style.animationDuration=(6+Math.random()*6)+"s";
  h.style.fontSize=(14+Math.random()*18)+"px";
  document.body.appendChild(h);
}
</script>

<div class="card">
  <h1>Nandani 💖</h1>

  <img id="gif" src="gif-start.gif" alt="gif">

  <div id="text">Will you be my Valentine? 💍</div>

  <div class="buttons">
    <button id="yes">YES 💖</button>
    <button id="no">NO 😢</button>
  </div>

  <div class="music-hint">🎵 Tap a button to feel the music</div>
</div>

<!-- Background Music -->
<audio id="bgm" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
let step = 0;
let musicStarted = false;

const gifs = [
  "gif-start.gif",
  "gif-no1.gif",
  "gif-no2.gif",
  "gif-no3.gif",
  "gif-yes.gif"
];

const texts = [
  "Will you be my Valentine? 💍",
  "Kya tum sach me mana kar rahi ho? 😔",
  "Dil toot raha hai mera… 🥺💔",
  "Last baar soch lo please… 😭",
  "Come here… I want you forever 💋❤️"
];

function playMusic(){
  if(!musicStarted){
    document.getElementById("bgm").play();
    musicStarted = true;
  }
}

function updateScreen(i){
  playMusic();
  document.getElementById("gif").src = gifs[i] + "?v=" + Date.now();
  document.getElementById("text").innerText = texts[i];
}

document.getElementById("no").onclick = ()=>{
  if(step < 3){
    step++;
    updateScreen(step);
  }
};

document.getElementById("yes").onclick = ()=>{
  step = 4;
  updateScreen(step);
  document.getElementById("no").style.display="none";
};
</script>

</body>
</html>
