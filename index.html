<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Nandani ❤️</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Pacifico&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ffd1dc, #fbc2eb, #fda085);
      padding: 20px;
    }

    .card {
      background: #fff;
      width: 100%;
      max-width: 360px;
      border-radius: 25px;
      padding: 25px 20px 30px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,0.15);
    }

    h1 {
      font-family: 'Pacifico', cursive;
      color: #ff4d88;
      font-size: 36px;
      margin-bottom: 15px;
    }

    img {
      width: 220px;
      max-width: 100%;
      border-radius: 18px;
      margin: 15px 0;
    }

    p {
      font-size: 18px;
      margin: 15px 0 20px;
      color: #333;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 10px;
    }

    button {
      border: none;
      padding: 12px 22px;
      border-radius: 30px;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    button:active {
      transform: scale(0.95);
    }

    .yes {
      background: #ff4d88;
      color: #fff;
      box-shadow: 0 6px 15px rgba(255,77,136,0.4);
    }

    .no {
      background: #e0e0e0;
      color: #000;
    }

    .music {
      margin-top: 18px;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>Nandani 💖</h1>

    <img id="gif" src="gif-start.gif" alt="gif">

    <p id="text">Will you be my Valentine? 💍</p>

    <div class="buttons">
      <button class="yes" id="yesBtn">YES ✨</button>
      <button class="no" id="noBtn">NO 😢</button>
    </div>

    <div class="music">🎵 Tap any button to feel the music</div>
  </div>

  <audio id="bgMusic" src="music.mp3"></audio>

  <script>
    const gif = document.getElementById("gif");
    const text = document.getElementById("text");
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const music = document.getElementById("bgMusic");

    let noCount = 0;

    const noGifs = [
      "gif-no1.gif",
      "gif-no2.gif",
      "gif-no3.gif"
    ];

    const noTexts = [
      "Kya tum sach me mana kar rahi ho? 🥺",
      "Dil toot raha hai mera… 💔",
      "Last baar soch lo please… 😭"
    ];

    function playMusic() {
      if (music.paused) {
        music.play().catch(() => {});
      }
    }

    yesBtn.addEventListener("click", () => {
      playMusic();
      gif.src = "gif-yes.gif";
      text.innerHTML = "Come here… I want you forever 💋❤️";
      noBtn.style.display = "none";
    });

    noBtn.addEventListener("click", () => {
      playMusic();

      if (noCount < noGifs.length) {
        gif.src = noGifs[noCount];
        text.innerHTML = noTexts[noCount];
        noCount++;
      } else {
        gif.src = noGifs[noGifs.length - 1];
        text.innerHTML = "Please maan jao na… 😭💔";
      }
    });
  </script>

</body>
</html>
