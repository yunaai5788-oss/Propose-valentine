  <!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nandani 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Pacifico&display=swap" rel="stylesheet">

<style>

*{

  margin:0;

  padding:0;

  box-sizing:border-box;

  font-family:'Poppins',sans-serif;

}

body{

  min-height:100vh;

  background:linear-gradient(135deg,#ffd1e8,#e5d9ff);

  display:flex;

  justify-content:center;

  align-items:center;

}

.card{

  width:92%;

  max-width:380px;

  background:#fff;

  border-radius:24px;

  padding:22px;

  text-align:center;

  box-shadow:0 15px 35px rgba(0,0,0,0.25);

}

h1{

  font-family:'Pacifico',cursive;

  color:#ff3f81;

  font-size:30px;

  margin-bottom:12px;

}

/* GIF – ALWAYS PRESENT */

#gif{

  width:100%;

  max-width:320px;

  height:230px;

  object-fit:contain;

  border-radius:18px;

  margin:10px auto 15px;

  display:block;

  pointer-events:none; /* buttons safe */

  transition:0.3s ease;

}

#text{

  font-size:18px;

  margin:10px 0 18px;

}

/* Buttons */

.buttons{

  display:flex;

  justify-content:center;

  gap:16px;

}

button{

  padding:12px 26px;

  border:none;

  border-radius:30px;

  font-size:16px;

  cursor:pointer;

  z-index:10;

}

#yes{

  background:#ff3f81;

  color:#fff;

  animation:pulse 1.4s infinite;

}

@keyframes pulse{

  0%{transform:scale(1);}

  50%{transform:scale(1.1);}

  100%{transform:scale(1);}

}

#no{

  background:#e0e0e0;

}

</style>

</head>

<body>

<div class="card">

  <h1>Nandani 💖</h1>

  <!-- SINGLE GIF AREA (never disappears) -->

  <img id="gif"

    src="https://media.tenor.com/2roX3uxz_68AAAAC/couple-love.gif"

    alt="love gif">

  <div id="text">Will you be my Valentine? 💍</div>

  <div class="buttons">

    <button id="yes">YES 💖</button>

    <button id="no">NO 😢</button>

  </div>

</div>

<script>
let step = 0;

const gifs = [
  "https://media.tenor.com/2roX3uxz_68AAAAC/couple-love.gif",
  "https://media.tenor.com/6M8JfZs8HkMAAAAC/sad-couple.gif",
  "https://media.tenor.com/jn9KpQ4gkXAAAAAC/crying-cute.gif",
  "https://media.tenor.com/6QKx9Y7t4mQAAAAC/heart-broken.gif",
  "https://media.tenor.com/7XxK9KX4b3sAAAAC/romantic-kiss-couple.gif"
];

const texts = [
  "Will you be my Valentine? 💍",
  "Kya tum sach me mana kar rahi ho? 😔",
  "Dil toot raha hai mera… 🥺💔",
  "Last baar soch lo please… 😭",
  "Come here… I want you forever 💋❤️"
];

function setGif(index){
  const img = document.getElementById("gif");
  img.src = gifs[index] + "?v=" + new Date().getTime(); // 🔥 FIX
}

document.getElementById("no").onclick = () => {
  if(step < 3){
    step++;
    setGif(step);
    document.getElementById("text").innerText = texts[step];
  }
};

document.getElementById("yes").onclick = () => {
  step = 4;
  setGif(step);
  document.getElementById("text").innerText = texts[4];
  document.getElementById("no").style.display = "none";
};
</script>

</body>

</html>
    
  </body>
  
</html>
