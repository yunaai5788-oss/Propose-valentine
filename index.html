<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Nandani 💖</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;500&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Poppins',sans-serif;}

body{
  min-height:100vh;
  background: linear-gradient(135deg,#ffb6c1,#ffc0cb,#ffd1dc);
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

/* floating hearts */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background-image:url("https://i.imgur.com/8KZtFQH.png");
  opacity:0.15;
  animation:float 20s linear infinite;
}
@keyframes float{
  from{background-position:0 0;}
  to{background-position:0 -2000px;}
}

.card{
  background:white;
  width:92%;
  max-width:360px;
  padding:25px;
  border-radius:25px;
  box-shadow:0 20px 40px rgba(0,0,0,0.2);
  text-align:center;
  z-index:2;
}

h1{
  font-family:'Pacifico',cursive;
  color:#ff4d88;
  font-size:36px;
  margin-bottom:10px;
}

img{
  width:100%;
  max-height:260px;
  object-fit:contain;
  border-radius:15px;
  margin:15px 0;
}

p{
  font-size:18px;
  margin:15px 0;
}

.buttons{
  display:flex;
  gap:15px;
  justify-content:center;
  margin-top:10px;
}

button{
  border:none;
  padding:12px 22px;
  border-radius:30px;
  font-size:18px;
  cursor:pointer;
}

#yes{
  background:#ff4d88;
  color:white;
}

#no{
  background:#e0e0e0;
}

.musicHint{
  margin-top:10px;
  font-size:14px;
  opacity:0.6;
}
</style>
</head>

<body>

<div class="card">
  <h1>Nandani 💖</h1>

  <!-- GIF IMAGE -->
  <img id="gif" src="start.gif" alt="gif">

  <!-- TEXT -->
  <p id="text">Will you be my Valentine? 💍</p>

  <!-- BUTTONS -->
  <div class="buttons">
    <button id="yes">YES ✨</button>
    <button id="no">NO 😢</button>
  </div>

  <div class="musicHint">🎵 Tap any button to feel the music</div>
</div>

<!-- MUSIC -->
<audio id="bgm" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
const gifs = [
  "gif-start.gif",      // 0 start
  "gif-no1.gif",       // 1 NO
  "gif-no2.gif",       // 2 NO again
  "gif-no3.gif",       // 3 last NO
  "gif-yes.gif"        // 4 YES final
];

const texts = [
  "Will you be my Valentine? 💍",
  "Kya tum sach me mana kar rahi ho? 🥺",
  "Dil toot raha hai mera… 💔",
  "Last baar soch lo please… 😭",
  "Come here… I want you forever 💋❤️"
];

let step = 0;
const gif = document.getElementById("gif");
const text = document.getElementById("text");
const bgm = document.getElementById("bgm");

function playMusic(){
  bgm.volume = 0.7;
  bgm.play().catch(()=>{});
}

document.getElementById("no").onclick = ()=>{
  playMusic();
  if(step < 3){
    step++;
    gif.src = gifs[step] + "?v=" + Date.now();
    text.innerText = texts[step];
  }
};

document.getElementById("yes").onclick = ()=>{
  playMusic();
  step = 4;
  gif.src = gifs[4] + "?v=" + Date.now();
  text.innerText = texts[4];
  document.getElementById("no").style.display="none";
};
</script>

</body>
</html>
